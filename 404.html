.nf-wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;background:var(--bg-light);padding:20px 16px 28px}

.nf-brand .brand-sub{color:var(--text-sub);font-size:10px}
.nf-card{width:min(640px,100%);display:flex;flex-direction:column;align-items:center;text-align:center;margin:auto;padding:24px 16px}

.nf-desc{margin-top:10px;color:var(--text-muted);font-size:13px;max-width:520px;line-height:1.6}
.nf-btn{margin-top:18px;display:inline-flex;align-items:center;gap:8px;background:var(--primary-green);border:1px solid var(--primary-green);color:#fff;font-size:13px;font-weight:700;padding:11px 20px;border-radius:8px;text-decoration:none}
.nf-btn:hover{background:var(--primary-green-dark)}
.nf-btn:focus-visible{outline:2px solid var(--secondary-blue-dark);outline-offset:2px}
.nf-foot{color:var(--text-muted);font-size:11px;margin-top:24px}
@media(max-width:768px){.nf-title{font-size:24px}.nf-btn{width:100%;justify-content:center;padding:13px 16px}.nf-illu{padding:28px 16px}.nf-wrap{padding-bottom:90px}.nf-foot{margin-top:auto;padding-top:24px}}
